blob:
  server:
    port: '6124'
taskmanager:
  memory:
    process:
      size: 1728m
  numberOfTaskSlots: 2
metrics:
  reporter:
    prom:
      port: '9249'
      factory:
        class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
classloader:
  resolve-order: parent-first
jobmanager:
  rpc:
    address: jobmanager
  memory:
    process:
      size: 1600m
query:
  server:
    port: '6125'
s3:
  access-key: minioadmin
  secret-key: minioadmin
  endpoint: http://minio:9000
  path:
    style:
      access: 'true'
parallelism:
  default: 1
